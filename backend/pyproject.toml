[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # Do not perform function call `Depends` in argument defaults (standard FastAPI pattern)
    "SIM102", # Nested if statements
    "E501",   # Line length
    "E402",   # Module level import not at top of file (sys.path manipulation required before imports)
    "UP042",  # Class inherits from both str and enum.Enum (compatible with SQLAlchemy Enum types)
    "B011",   # Do not assert False
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
